<div class="container pt-4 pb-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h1 class="h3 fw-bold mb-0"><i class="bi bi-shield-lock"></i> Admin</h1>
    <div class="btn-group" role="group" aria-label="Admin sections">
      <a class="btn btn-sm {{ 'btn-brand' if request.endpoint == 'admin_dashboard' else 'btn-outline-brand' }}" href="{{ url_for('admin_dashboard') }}">Dashboard</a>
      <a class="btn btn-sm {{ 'btn-brand' if request.endpoint in ('admin_events','add_event','edit_event') else 'btn-outline-brand' }}" href="{{ url_for('admin_events') }}">Events</a>
      <a class="btn btn-sm {{ 'btn-brand' if request.endpoint in ('admin_registrations','admin_registration_detail') else 'btn-outline-brand' }}" href="{{ url_for('admin_registrations') }}">Registrations</a>
    </div>
  </div>
</div>
